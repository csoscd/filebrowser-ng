################################################################################
# GitHub Actions – Build and push :dev Docker image on development branches
#
# Trigger: every push to any branch except main
#          (also available as manual dispatch for testing)
#
# Image produced:
#   cs1711/filebrowser-ng:dev
#
# The :dev tag is always overwritten – it reflects the state of whichever
# development branch was pushed to most recently. Not for production use.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
#
# @author  Christian Schulz <technik@meinetechnikwelt.rocks>
# @license GNU General Public License version 3 or later
################################################################################

name: Build and push dev Docker image

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual dev build (informational only)"
        required: false
        default: "Manual dev build"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php-tests:
    name: Unit + integration tests (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit + integration tests
        run: ./vendor/bin/phpunit --testsuite unit,integration

  build-and-push-dev:
    name: Build cs1711/filebrowser-ng:dev
    runs-on: ubuntu-latest
    needs: [php-tests]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push cs1711/filebrowser-ng:dev
        uses: docker/build-push-action@v6
        with:
          context:    .
          file:       docker/web/Dockerfile
          push:       true
          tags:       cs1711/filebrowser-ng:dev
          build-args: APP_VERSION=dev-${{ github.ref_name }}@${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.title=filebrowser-ng
            org.opencontainers.image.description=Development build – not for production use
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms:  linux/amd64,linux/arm64
